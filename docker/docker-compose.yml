# 사용: docker compose -f docker/docker-compose.yml --profile single up -d
# single = 단일 노드 Kafka(KRaft) + 단일 노드 RabbitMQ + 모니터링. (클러스터 프로파일은 후속 SPEC)
name: mq-study

x-limits: &default-limits
  restart: "no"

services:
  kafka:
    image: ${KAFKA_IMAGE}
    profiles: [single]
    container_name: mqt-kafka
    <<: *default-limits
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000   # 토픽 retention.bytes 초과분을 10초마다 정리 (기본 5분). 디스크 보호용
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    profiles: [single]
    container_name: mqt-rabbitmq
    <<: *default-limits
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-exporter:
    image: ${KAFKA_EXPORTER_IMAGE}
    profiles: [single]
    container_name: mqt-kafka-exporter
    <<: *default-limits
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 128m

  cadvisor:
    image: ${CADVISOR_IMAGE}
    profiles: [single]
    container_name: mqt-cadvisor
    <<: *default-limits
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles: [single]
    container_name: mqt-prometheus
    <<: *default-limits
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: ${GRAFANA_IMAGE}
    profiles: [single]
    container_name: mqt-grafana
    <<: *default-limits
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  kafka-data:
  rabbitmq-data:
  prometheus-data:
