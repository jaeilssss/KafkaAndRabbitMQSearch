# Exp 2. Producer Scaling (연구 계획서 §11)
# producer 1/2/4/8/16/32, consumer 1 / 1KB / Kafka partition 1 / RabbitMQ queue 1, 무제한 rate(시간 기반 종료)
# 내구성은 각 브로커 기본값: Kafka acks=1, RabbitMQ publisher confirm OFF + classic queue.
# producer 수가 많을수록 부하 생성기(러너 JVM)가 병목일 수 있으니 결과의 generatorSaturated 를 반드시 확인한다.
#
# 디스크 보호 (중요): Docker VM 디스크 여유가 약 22GB 인데, Kafka producers=32 는 consumer 1개가 못 따라가 backlog 가
# 초당 약 9만 건씩 쌓인다(quick 실측: 30초에 약 470만 건). 시간 기반(약 420초)이면 약 56GB 가 되어 디스크가 가득 찬다.
# consumer/partition 을 늘려도 소비가 약 67K msg/s 에서 막혀 해결되지 않았다(quick 실측).
# 그래서 messageCount 상한(1,200만 건 = 약 12GB)을 두고 시간 기반 종료와 "먼저 도달하는 쪽"으로 끝낸다.
#  - 측정 구간은 계획서의 300초 대신 90초로 줄였다(반복 3회는 유지). 안정 구간 처리량은 수십 초면 충분하고 분산은 반복으로 본다.
#    첫 full 결과에서 Run 간 stddev 가 평균의 약 5% 이내인지 확인하고, 크면 해당 포인트만 늘려 다시 돌린다.
#  - 발행이 빠른 포인트(Kafka producers 4 이상)는 총량 상한 때문에 측정 구간이 90초보다 더 짧아질 수 있다(약 50초).
#    포인트마다 실제 측정 구간이 다르므로 결과에 처리량의 측정 시간(Run JSON 의 윈도우)을 함께 보고한다.
#  - warm-up 은 120초 대신 30초로 줄였다(120초면 빠른 포인트에서 warm-up 중에 상한에 도달해 측정 구간이 없어진다).
#  - 이는 계획서 §24 의 조건(warm-up 120초 / measure 300초)에서 벗어나는 의도적인 변경이다. 논문/블로그에 명시한다.
experiment: exp2-producer-scaling
description: producer 수 증가에 따른 처리량 확장과 포화 지점 관찰
brokers: [kafka, rabbitmq]
base:
  messageSizeBytes: 1024
  consumers: 1
  messageCount: 12000000        # 디스크 보호용 총량 상한 (시간 기반 종료와 먼저 도달하는 쪽으로 끝남)
  kafka:
    partitions: 1
    replicationFactor: 1
    acks: "1"
  rabbitmq:
    queueType: classic
    publisherConfirms: false
    prefetch: 250
vary:
  producers: [1, 2, 4, 8, 16, 32]
profiles:
  full:
    warmupSeconds: 30
    measureSeconds: 90
    cooldownSeconds: 60
    repetitions: 3
    pauseBetweenRunsSeconds: 10
  quick:
    warmupSeconds: 5
    measureSeconds: 15
    cooldownSeconds: 5
    repetitions: 1
    pauseBetweenRunsSeconds: 3
