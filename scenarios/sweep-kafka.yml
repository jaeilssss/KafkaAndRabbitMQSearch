# step load: 2K -> 4K msg/s, 각 step 2회 반복, step 당 warm-up 2s + measure 10s
name: sweep-kafka
broker: kafka
messageSizeBytes: 1024
producers: 1
consumers: 1
warmupSeconds: 2
measureSeconds: 10
cooldownSeconds: 15
rateSteps: [2000, 4000]
repetitions: 2
pauseBetweenRunsSeconds: 3
kafka:
  partitions: 1
  acks: "1"
